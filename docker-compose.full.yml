version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: audiobook-db
    environment:
      POSTGRES_USER: audiobook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-audiobook_password}
      POSTGRES_DB: audiobook
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audiobook"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - audiobook-network

  # Web Service (FastAPI)
  web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VERSION: ${TORCH_VERSION:-cpu}
    container_name: audiobook-web
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://audiobook:${POSTGRES_PASSWORD:-audiobook_password}@db:5432/audiobook
      - TTS_GPU=${TTS_GPU:-false}
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
      - ENABLE_BACKGROUND_PROCESSOR=false  # Worker handles this
      - WORKER_MODE=false
      - AUDIO_OUTPUT_FORMAT=${AUDIO_OUTPUT_FORMAT:-m4b}
      - AUDIO_BITRATE=${AUDIO_BITRATE:-128k}
      - TTS_FINE_TUNED_MODEL=${TTS_FINE_TUNED_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - audiobook-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Worker Service (Background Job Processor)
  worker:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VERSION: ${TORCH_VERSION:-cpu}
    container_name: audiobook-worker
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://audiobook:${POSTGRES_PASSWORD:-audiobook_password}@db:5432/audiobook
      - TTS_GPU=${TTS_GPU:-false}
      - WORKER_MODE=true
      - ENABLE_BACKGROUND_PROCESSOR=true
      - AUDIO_OUTPUT_FORMAT=${AUDIO_OUTPUT_FORMAT:-m4b}
      - AUDIO_BITRATE=${AUDIO_BITRATE:-128k}
      - TTS_FINE_TUNED_MODEL=${TTS_FINE_TUNED_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - audiobook-network
    command: python -m src.web.worker
    deploy:
      resources:
        limits:
          cpus: '${WORKER_CPUS:-2}'
          memory: ${WORKER_MEMORY:-4G}
        reservations:
          cpus: '1'
          memory: 2G

  # GPU-enabled versions (optional profiles)
  web-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VERSION: ${TORCH_VERSION:-cuda118}
    container_name: audiobook-web-gpu
    ports:
      - "${WEB_PORT:-8000}:8000"
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://audiobook:${POSTGRES_PASSWORD:-audiobook_password}@db:5432/audiobook
      - TTS_GPU=true
      - WEB_HOST=0.0.0.0
      - WEB_PORT=8000
      - ENABLE_BACKGROUND_PROCESSOR=false
      - WORKER_MODE=false
      - AUDIO_OUTPUT_FORMAT=${AUDIO_OUTPUT_FORMAT:-m4b}
      - AUDIO_BITRATE=${AUDIO_BITRATE:-128k}
      - TTS_FINE_TUNED_MODEL=${TTS_FINE_TUNED_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped
    networks:
      - audiobook-network
    profiles:
      - gpu
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  worker-gpu:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        TORCH_VERSION: ${TORCH_VERSION:-cuda118}
    container_name: audiobook-worker-gpu
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - DATABASE_URL=postgresql://audiobook:${POSTGRES_PASSWORD:-audiobook_password}@db:5432/audiobook
      - TTS_GPU=true
      - WORKER_MODE=true
      - ENABLE_BACKGROUND_PROCESSOR=true
      - AUDIO_OUTPUT_FORMAT=${AUDIO_OUTPUT_FORMAT:-m4b}
      - AUDIO_BITRATE=${AUDIO_BITRATE:-128k}
      - TTS_FINE_TUNED_MODEL=${TTS_FINE_TUNED_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
      web-gpu:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
        limits:
          cpus: '${WORKER_CPUS:-4}'
          memory: ${WORKER_MEMORY:-8G}
        reservations:
          cpus: '2'
          memory: 4G
    restart: unless-stopped
    networks:
      - audiobook-network
    profiles:
      - gpu
    command: python -m src.web.worker

volumes:
  postgres_data:
    driver: local

networks:
  audiobook-network:
    driver: bridge
