[mypy]
# Python version
python_version = 3.11

# Platform
platform = darwin

# Follow imports
follow_imports = normal

# Ignore missing imports for third-party packages
ignore_missing_imports = True

# Show error codes
show_error_codes = True

# Show column numbers
show_column_numbers = True

# Pretty output
pretty = True

# Color output
color_output = True

# Incremental mode (faster, but requires .mypy_cache)
incremental = True

# Strict mode settings (gradually enable these)
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
warn_no_return = True
check_untyped_defs = True
disallow_untyped_defs = False  # Set to True when ready for strict typing
disallow_incomplete_defs = False  # Set to True when ready for strict typing
no_implicit_optional = True
warn_unreachable = True

# Exclude patterns
exclude = (
    venv/,
    .venv/,
    .git/,
    __pycache__/,
    .pytest_cache/,
    .mypy_cache/,
    build/,
    dist/,
    *.egg-info/,
)

# Per-module options
[mypy-src.controllers.*]
# Controllers may have more dynamic typing
disallow_untyped_defs = False

[mypy-src.web.*]
# Web routes may have more dynamic typing
disallow_untyped_defs = False

[mypy-tests.*]
# Tests can be more lenient
disallow_untyped_defs = False
ignore_errors = True

# Third-party packages that don't have type stubs
[mypy-coqui_tts.*]
ignore_missing_imports = True

[mypy-TTS.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = False

[mypy-fastapi.*]
ignore_missing_imports = False

[mypy-uvicorn.*]
ignore_missing_imports = False

