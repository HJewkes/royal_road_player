apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: audiobook-ingress
  namespace: audiobook
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod  # For TLS
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  tls:
  - hosts:
    - audiobook.example.com  # Change to your domain
    secretName: audiobook-tls
  rules:
  - host: audiobook.example.com  # Change to your domain
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: audiobook-web
            port:
              number: 8000
