apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobook-db
  namespace: audiobook
  labels:
    app: audiobook
    component: database
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audiobook
      component: database
  template:
    metadata:
      labels:
        app: audiobook
        component: database
    spec:
      containers:
      - name: postgres
        image: postgres:15-alpine
        ports:
        - containerPort: 5432
          name: postgres
        env:
        - name: POSTGRES_USER
          value: "audiobook"
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: audiobook-secrets
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          value: "audiobook"
        volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
        livenessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - audiobook
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          exec:
            command:
            - pg_isready
            - -U
            - audiobook
          initialDelaySeconds: 5
          periodSeconds: 5
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "1Gi"
            cpu: "500m"
      volumes:
      - name: postgres-data
        persistentVolumeClaim:
          claimName: postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: audiobook-db
  namespace: audiobook
  labels:
    app: audiobook
    component: database
spec:
  type: ClusterIP
  ports:
  - port: 5432
    targetPort: 5432
    protocol: TCP
    name: postgres
  selector:
    app: audiobook
    component: database
