apiVersion: v1
kind: Secret
metadata:
  name: audiobook-secrets
  namespace: audiobook
type: Opaque
stringData:
  # Database password (change in production!)
  POSTGRES_PASSWORD: "audiobook_password"
  
  # AWS Credentials (for LocalStack use test/test, for AWS use real credentials)
  AWS_ACCESS_KEY_ID: "test"
  AWS_SECRET_ACCESS_KEY: "test"
  
  # S3 Endpoint (empty for real AWS, http://localstack:4566 for LocalStack)
  S3_ENDPOINT_URL: "http://localstack:4566"
  SQS_ENDPOINT_URL: "http://localstack:4566"
  CLOUDWATCH_ENDPOINT_URL: "http://localstack:4566"
  SNS_ENDPOINT_URL: "http://localstack:4566"
  SECRETS_MANAGER_ENDPOINT_URL: "http://localstack:4566"
