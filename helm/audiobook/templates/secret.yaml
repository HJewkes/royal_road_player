apiVersion: v1
kind: Secret
metadata:
  name: {{ include "audiobook.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "audiobook.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.secrets.postgresPassword | quote }}
  AWS_ACCESS_KEY_ID: {{ .Values.secrets.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.secrets.awsSecretAccessKey | quote }}
  S3_ENDPOINT_URL: {{ .Values.secrets.s3EndpointUrl | quote }}
  SQS_ENDPOINT_URL: {{ .Values.secrets.sqsEndpointUrl | quote }}
  CLOUDWATCH_ENDPOINT_URL: {{ .Values.secrets.cloudwatchEndpointUrl | quote }}
  SNS_ENDPOINT_URL: {{ .Values.secrets.snsEndpointUrl | quote }}
  SECRETS_MANAGER_ENDPOINT_URL: {{ .Values.secrets.secretsManagerEndpointUrl | quote }}
