apiVersion: apps/v1
kind: Deployment
metadata:
  name: audiobook-web
  namespace: audiobook
  labels:
    app: audiobook
    component: web
spec:
  replicas: 2  # Scale horizontally
  selector:
    matchLabels:
      app: audiobook
      component: web
  template:
    metadata:
      labels:
        app: audiobook
        component: web
    spec:
      containers:
      - name: web
        image: audiobook:latest  # Change to your image registry
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: audiobook-config
        - secretRef:
            name: audiobook-secrets
        env:
        - name: DATABASE_URL
          value: "postgresql://audiobook:$(POSTGRES_PASSWORD)@audiobook-db:5432/audiobook"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 5
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
---
apiVersion: v1
kind: Service
metadata:
  name: audiobook-web
  namespace: audiobook
  labels:
    app: audiobook
    component: web
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    protocol: TCP
    name: http
  selector:
    app: audiobook
    component: web
