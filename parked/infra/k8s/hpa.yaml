apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audiobook-web-hpa
  namespace: audiobook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audiobook-web
  minReplicas: 2
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: audiobook-worker-hpa
  namespace: audiobook
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: audiobook-worker
  minReplicas: 2
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
